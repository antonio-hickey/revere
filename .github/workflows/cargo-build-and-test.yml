name: Cargo Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install GTK/Pango, DBus deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libglib2.0-dev \
          libpango1.0-dev \
          libcairo2-dev \
          libharfbuzz-dev \
          libfontconfig1-dev \
          libdbus-1-dev \
          pkg-config
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
